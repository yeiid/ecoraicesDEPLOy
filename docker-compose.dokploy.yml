# Despliegue en Dokploy — EcoRaíces
# Uso: en tu proyecto Dokploy, crea un despliegue tipo "Compose" y pega este archivo.
# Define las variables de entorno en la pestaña "Environment" de Dokploy.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ecoraices}:${POSTGRES_PASSWORD:-ecoraices_dev}@db:5432/${POSTGRES_DB:-ecoraices}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET es obligatoria}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    volumes:
      - uploads_data:/app/public/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecoraices}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecoraices_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ecoraices}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecoraices} -d ${POSTGRES_DB:-ecoraices}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      HOST: 0.0.0.0
      PORT: 8080
      BACKEND_URL: http://backend:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecoraices}:${POSTGRES_PASSWORD:-ecoraices_dev}@db:5432/${POSTGRES_DB:-ecoraices}
      POSTGIS_URL: postgresql://${POSTGRES_USER:-ecoraices}:${POSTGRES_PASSWORD:-ecoraices_dev}@db:5432/${POSTGRES_DB:-ecoraices}
      APP_URL: ${APP_URL:-https://ecoraices.neuraljira.tech}
      PUBLIC_MAP_API_URL: ${PUBLIC_MAP_API_URL:-https://map.neuraljira.tech}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatoria}
      PLANTNET_API_KEY: ${PLANTNET_API_KEY:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-yeifran67@gmail.com}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
    volumes:
      - uploads_data:/data/uploads

volumes:
  pgdata:
  uploads_data:
