global:
  scrape_interval: 10s

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
  - job_name: sync-service
    static_configs:
      - targets: ["sync-service:8080"]
    metrics_path: /metrics
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: node-exporter
    static_configs:
      - targets: ["host.docker.internal:9100"]
