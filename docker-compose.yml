name: ecoraices

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ecoraices-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecoraices}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecoraices_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ecoraices}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./frontend/scripts/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecoraices} -d ${POSTGRES_DB:-ecoraices}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ecoraices-frontend
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecoraices}:${POSTGRES_PASSWORD:-ecoraices_dev}@db:5432/${POSTGRES_DB:-ecoraices}
      POSTGIS_URL: postgresql://${POSTGRES_USER:-ecoraices}:${POSTGRES_PASSWORD:-ecoraices_dev}@db:5432/${POSTGRES_DB:-ecoraices}
      APP_URL: ${APP_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatoria en produccion}
      PLANTNET_API_KEY: ${PLANTNET_API_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    ports:
      - "${APP_PORT:-3000}:8080"
    volumes:
      - uploads_data:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: ecoraices-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecoraices}:${POSTGRES_PASSWORD:-ecoraices_dev}@db:5432/${POSTGRES_DB:-ecoraices}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/data/uploads
    restart: unless-stopped

volumes:
  pgdata:
  uploads_data:
